<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Statistiques — Hegalaldia</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f4f7f4;
      color: #1a2e1e;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #0c3d22;
      color: #fff;
      padding: 0 24px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 0;
    }
    .header img { height: 56px; flex-shrink: 0; }
    .header-text { flex: 1; }
    .header-text h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .header-text p { font-size: 13px; color: #9ecfb0; margin-top: 2px; }
    .back-link {
      color: #9ecfb0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .back-link:hover { color: #fff; }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }
    .btn-refresh {
      background: #019939;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s;
    }
    .btn-refresh:hover { background: #017a2e; }
    .btn-refresh:disabled { background: #8a9a8d; cursor: default; }

    /* ── KPI cards ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    @media (max-width: 800px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }

    .kpi-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px 18px;
      border: 1.5px solid #e4ece5;
      box-shadow: 0 1px 6px rgba(12,61,34,0.06);
    }
    .kpi-label {
      font-size: 11.5px;
      font-weight: 600;
      color: #6b7f6e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 32px;
      font-weight: 800;
      color: #0c3d22;
      line-height: 1;
    }
    .kpi-value.accent { color: #019939; }
    .kpi-sub {
      font-size: 12px;
      color: #8a9a8d;
      margin-top: 5px;
    }

    /* ── Charts ── */
    .chart-card {
      background: #fff;
      border-radius: 14px;
      padding: 22px 20px;
      border: 1.5px solid #e4ece5;
      box-shadow: 0 1px 6px rgba(12,61,34,0.06);
      margin-bottom: 20px;
    }
    .chart-card h2 {
      font-size: 14px;
      font-weight: 700;
      color: #0c3d22;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 700px) { .chart-row { grid-template-columns: 1fr; } }

    .chart-wrap { position: relative; height: 240px; }
    .chart-wrap-tall { position: relative; height: 280px; }

    /* ── Table ── */
    .table-card {
      background: #fff;
      border-radius: 14px;
      padding: 22px 20px;
      border: 1.5px solid #e4ece5;
      box-shadow: 0 1px 6px rgba(12,61,34,0.06);
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .table-card h2 {
      font-size: 14px;
      font-weight: 700;
      color: #0c3d22;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: #6b7f6e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 10px 10px 10px;
      border-bottom: 1.5px solid #e4ece5;
    }
    tbody tr { border-bottom: 1px solid #f0f4f1; }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 9px 10px; color: #2a3d2e; }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .badge-relache  { background: #e8f5e9; color: #1b7a3a; }
    .badge-deces    { background: #f0f2f1; color: #4a5a4e; }
    .badge-euthanasie { background: #fff3ec; color: #b84c00; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state svg { opacity: 0.25; margin-bottom: 16px; }
    .empty-state h3 { font-size: 17px; font-weight: 700; color: #0c3d22; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: #6b7f6e; max-width: 340px; margin: 0 auto; line-height: 1.6; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6b7f6e;
      font-size: 14px;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 28px 24px 36px;
      font-size: 12px;
      color: #9aaa9d;
    }
    footer a { color: #0c3d22; font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-inner">
      <img src="LogoHegalaldiaBlancSimpleCrop.png" alt="Hegalaldia">
      <div class="header-text">
        <h1>Statistiques</h1>
        <p>Centre de sauvegarde de la faune sauvage</p>
      </div>
      <a class="back-link" href="/index.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Accueil
      </a>
    </div>
  </div>

  <main>
    <div class="topbar">
      <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Rafraîchir
      </button>
    </div>

    <div id="content">
      <div class="loading">Chargement des statistiques…</div>
    </div>
  </main>

  <footer>
    <a href="/index.html">← Accueil</a> &nbsp;·&nbsp; Hegalaldia &nbsp;·&nbsp; Réseau local
  </footer>

  <script>
    let charts = [];

    function destroyCharts() {
      charts.forEach(c => c.destroy());
      charts = [];
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    function badgeHtml(type) {
      const t = (type || '').toLowerCase();
      if (t === 'relache' || t === 'relâché' || t === 'relache') {
        return `<span class="badge badge-relache">Relâché</span>`;
      } else if (t === 'euthanasie' || t === 'euthanasié' || t === 'euthanasiee') {
        return `<span class="badge badge-euthanasie">Euthanasié</span>`;
      } else {
        return `<span class="badge badge-deces">Décès</span>`;
      }
    }

    function typeLabel(type) {
      const t = (type || '').toLowerCase();
      if (t === 'relache' || t.startsWith('rel')) return 'Relâché';
      if (t.startsWith('euth')) return 'Euthanasié';
      return 'Décès';
    }

    function renderEmpty() {
      return `<div class="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0c3d22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <h3>Aucune donnée encore enregistrée</h3>
        <p>Les statistiques s'alimenteront automatiquement dès que les cliniques partenaires enverront leurs premiers rapports.</p>
      </div>`;
    }

    async function loadData() {
      const btn = document.getElementById('btn-refresh');
      btn.disabled = true;
      btn.textContent = 'Chargement…';

      try {
        const [statsRes, vetosRes] = await Promise.all([
          fetch('/api/stats', { cache: 'no-store' }),
          fetch('/api/vetos', { cache: 'no-store' }),
        ]);

        const stats = await statsRes.json();
        const vetos = vetosRes.ok ? await vetosRes.json() : [];

        // Build code → name map
        const codeMap = {};
        for (const v of vetos) {
          if (v.code) codeMap[v.code] = v.nom;
        }

        destroyCharts();
        renderPage(stats, codeMap);
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="empty-state">
          <h3>Erreur de chargement</h3>
          <p>Impossible de contacter le serveur. Assurez-vous que server.py est en cours d'exécution.</p>
        </div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Rafraîchir`;
      }
    }

    function renderPage(stats, codeMap) {
      const totalYear  = stats.total_year  || 0;
      const totalMonth = stats.total_month || 0;
      const byType     = stats.outcomes_by_type || {};
      const topSpecies = stats.top_species || {};
      const weeklyData = stats.weekly_animals || {};
      const recent     = stats.recent_outcomes || [];

      // Empty state
      if (totalYear === 0 && recent.length === 0) {
        document.getElementById('content').innerHTML = renderEmpty();
        return;
      }

      // Survival rate
      const relache = byType['relache'] || byType['relâché'] || byType['Relâché'] || byType['Relache'] || 0;
      const deces   = byType['deces']   || byType['décès']   || byType['Décès']   || 0;
      const euth    = byType['euthanasie'] || byType['euthanasié'] || byType['Euthanasié'] || 0;
      const total_outcomes = relache + deces + euth;
      const survRate = total_outcomes > 0 ? Math.round(relache / total_outcomes * 100) : null;

      // Top species
      const topEntry = Object.entries(topSpecies)[0];
      const topSpeciesName = topEntry ? topEntry[0] : '—';

      // KPI html
      const kpiHtml = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Animaux cette année</div>
            <div class="kpi-value">${totalYear.toLocaleString('fr-FR')}</div>
            <div class="kpi-sub">depuis le 1er janvier</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Ce mois-ci</div>
            <div class="kpi-value accent">${totalMonth.toLocaleString('fr-FR')}</div>
            <div class="kpi-sub">animaux reçus</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Taux de survie</div>
            <div class="kpi-value">${survRate !== null ? survRate + ' %' : '—'}</div>
            <div class="kpi-sub">relâchés / (relâchés+décès+euth.)</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Espèce dominante</div>
            <div class="kpi-value" style="font-size:18px;padding-top:6px">${topSpeciesName}</div>
            <div class="kpi-sub">${topEntry ? topEntry[1] + ' cas cette année' : 'aucune donnée'}</div>
          </div>
        </div>`;

      // Weekly chart
      const weekLabels = Object.keys(weeklyData);
      const weekValues = Object.values(weeklyData);

      const weeklyChartHtml = `
        <div class="chart-card">
          <h2>Animaux reçus par semaine — 16 dernières semaines</h2>
          <div class="chart-wrap-tall">
            <canvas id="chart-weekly"></canvas>
          </div>
        </div>`;

      // Donut + horizontal bar
      const donutHtml = `
        <div class="chart-card">
          <h2>Types de sortie</h2>
          <div class="chart-wrap">
            <canvas id="chart-donut"></canvas>
          </div>
        </div>`;

      const speciesLabels = Object.keys(topSpecies);
      const speciesValues = Object.values(topSpecies);

      const speciesHtml = `
        <div class="chart-card">
          <h2>Top 10 espèces</h2>
          <div class="chart-wrap">
            <canvas id="chart-species"></canvas>
          </div>
        </div>`;

      // Table
      const rows = recent.slice(0, 50).map(o => `
        <tr>
          <td>${fmtDate(o.date)}</td>
          <td>${o.species || '<span style="color:#9aaa9d">Non précisée</span>'}</td>
          <td>${badgeHtml(o.type)}</td>
          <td>${o.commune || '—'}</td>
          <td><code style="font-size:11px;background:#f4f7f4;padding:2px 6px;border-radius:4px">${o.clinic_code || '—'}</code>${codeMap[o.clinic_code] ? `<span style="color:#6b7f6e;font-size:11px;margin-left:6px">${codeMap[o.clinic_code]}</span>` : ''}</td>
        </tr>`).join('');

      const tableHtml = `
        <div class="table-card">
          <h2>Historique des sorties récentes</h2>
          ${recent.length === 0
            ? '<p style="color:#8a9a8d;font-size:13px">Aucune sortie enregistrée.</p>'
            : `<table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Espèce</th>
                  <th>Type</th>
                  <th>Commune</th>
                  <th>Clinique</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>`}
        </div>`;

      document.getElementById('content').innerHTML =
        kpiHtml + weeklyChartHtml +
        `<div class="chart-row">${donutHtml}${speciesHtml}</div>` +
        tableHtml;

      // Render weekly bar chart
      const ctxWeekly = document.getElementById('chart-weekly').getContext('2d');
      charts.push(new Chart(ctxWeekly, {
        type: 'bar',
        data: {
          labels: weekLabels,
          datasets: [{
            label: 'Animaux reçus',
            data: weekValues,
            backgroundColor: '#019939cc',
            borderColor: '#019939',
            borderWidth: 1,
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { title: t => `Semaine ${t[0].label}` } }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#6b7f6e', font: { size: 11 } },
              grid: { color: '#f0f4f1' }
            },
            x: {
              ticks: { color: '#6b7f6e', font: { size: 10 }, maxRotation: 45 },
              grid: { display: false }
            }
          }
        }
      }));

      // Render donut
      const donutLabels = ['Relâché', 'Décès', 'Euthanasié'];
      const donutValues = [relache, deces, euth];
      const donutColors = ['#019939', '#8a9a8d', '#ec6724'];
      const ctxDonut = document.getElementById('chart-donut').getContext('2d');
      charts.push(new Chart(ctxDonut, {
        type: 'doughnut',
        data: {
          labels: donutLabels,
          datasets: [{
            data: donutValues,
            backgroundColor: donutColors,
            borderWidth: 2,
            borderColor: '#fff',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#2a3d2e', font: { size: 12 }, padding: 14, boxWidth: 12 }
            },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const val = ctx.parsed;
                  const pct = total_outcomes > 0 ? Math.round(val / total_outcomes * 100) : 0;
                  return ` ${val} (${pct} %)`;
                }
              }
            }
          }
        }
      }));

      // Render horizontal bar species
      const ctxSpecies = document.getElementById('chart-species').getContext('2d');
      charts.push(new Chart(ctxSpecies, {
        type: 'bar',
        data: {
          labels: speciesLabels,
          datasets: [{
            label: 'Animaux',
            data: speciesValues,
            backgroundColor: '#019939bb',
            borderColor: '#019939',
            borderWidth: 1,
            borderRadius: 3,
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
          },
          scales: {
            x: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#6b7f6e', font: { size: 11 } },
              grid: { color: '#f0f4f1' }
            },
            y: {
              ticks: { color: '#2a3d2e', font: { size: 11 } },
              grid: { display: false }
            }
          }
        }
      }));
    }

    loadData();
  </script>

<script src="/auth.js"></script>
</body>
</html>
